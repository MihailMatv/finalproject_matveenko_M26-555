[project]
name = "valutatrade-hub"
version = "0.1.0"
description = "ValutaTrade Hub — учебный валютный кошелёк и сервис курсов"
authors = [{ name = "Матвеенко Михаил Юрьевич" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"
valutatrade-parser = "valutatrade_hub.parser_service.scheduler:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.valutatrade]
data_dir = "data"
rates_ttl_seconds = 300
default_base_currency = "USD"
logs_dir = "logs"
log_level = "INFO"
log_max_bytes = 1000000
log_backup_count = 3
